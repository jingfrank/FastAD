model:
  name: FastAD
  backbone: tf_efficientnet_b4 
  layer_to_extract: 3
  device: cuda
  patchsize: 3
  stride: 1
  target_size: 256
  n_quantiles: 3
  fm_quantiles: 2
  min_q: 0.01
  max_q: 0.99
  fm_min_q: 0.01
  fm_max_q: 0.99
  patch_covariance_method: full
  global_covariance_method: LedoitWolf
  regularization: 0.01
  pretrained_weights_path: ${paths.weights.efficientnet_b4}
dataset:
  name: MVTec-AD
  source: ${paths.datasets.mvtec}
  classname: cable
  resize: 256
  train_batch_size: 64
  val_batch_size: 64
  test_batch_size: 64
  train_val_split: 0.9
  num_workers: 8
logging:
  output_dir: ${paths.project_root}/outputs/MVTec_AD/cable/efficientnet  
  log_dir: ${paths.project_root}/logs/MVTec_AD/cable/efficientnet
checkpoints:
  save_model: True
  save_dir: ${paths.project_root}/checkpoints/MVTec_AD/efficientnet/cable