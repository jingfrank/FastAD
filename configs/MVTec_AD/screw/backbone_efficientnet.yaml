model:
  name: FastAD
  backbone: tf_efficientnet_b4 
  layer_to_extract: 3
  device: cuda
  patchsize: 3
  stride: 1
  target_size: 224
  n_quantiles: 9
  fm_quantiles: 3
  min_q: 0.01
  max_q: 0.99
  fm_min_q: 0.01
  fm_max_q: 0.999
  patch_covariance_method: full
  global_covariance_method: LedoitWolf
  regularization: 0.0000001
  pretrained_weights_path: ${paths.weights.efficientnet_b4}
dataset:
  name: MVTec-AD
  source: ${paths.datasets.mvtec}
  classname: screw
  resize: 224
  train_batch_size: 64
  val_batch_size: 64
  test_batch_size: 64
  train_val_split: 0.9
  num_workers: 8
logging:
  output_dir: ${paths.project_root}/outputs/MVTec_AD/screw/efficientnet
  log_dir: ${paths.project_root}/logs/MVTec_AD/screw/efficientnet