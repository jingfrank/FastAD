model:
  name: FastAD
  backbone: resnet101
  layer_to_extract: 3
  device: cuda
  patchsize: 3
  stride: 1
  target_size: 256
  n_quantiles: 3
  fm_quantiles: 2
  min_q: 0.01
  max_q: 0.99
  fm_min_q: 0.01
  fm_max_q: 0.99
  patch_covariance_method: full
  global_covariance_method: EmpiricalCovariance
  regularization: 0.0001
  pretrained_weights_path: ${paths.weights.resnet101}
dataset:
  name: MVTec-AD
  source: ${paths.datasets.mvtec}
  classname: screw
  resize: 256
  train_batch_size: 64
  val_batch_size: 64
  test_batch_size: 64
  train_val_split: 0.8
  num_workers: 8
logging:
  output_dir: ${paths.project_root}/outputs/MVTec_AD/screw
  log_dir: ${paths.project_root}/logs/MVTec_AD/screw