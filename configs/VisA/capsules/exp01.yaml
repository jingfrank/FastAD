model:
  name: FastAD
  backbone: "wide_resnet50_2"             
  layer_to_extract: 2       
  device: cuda                  

  # Patch 相关
  patchsize: 3
  stride: 1

  target_size: 256    

  # 分位数参数
  n_quantiles: 3
  fm_quantiles: 2
  min_q: 0.01
  max_q: 0.99
  fm_min_q: 0.01
  fm_max_q: 0.99
  # 协方差估计方法
  patch_covariance_method: shrunk 
  global_covariance_method: LedoitWolf
  regularization: 0.0000001
  # 额外功能
  pretrained_weights_path: ${paths.weights.wide_resnet50_2}

dataset:
  name: MVTec-AD
  source: ${paths.datasets.visa}
  classname: capsules
  resize : 256
  train_batch_size: 32
  val_batch_size: 32
  test_batch_size: 32
  train_val_split: 0.5
  num_workers: 4

logging:
  output_dir: ${paths.project_root}/outputs/VisA/capsules/exp01
  log_dir: ${paths.project_root}/logs/VisA/capsules/exp01