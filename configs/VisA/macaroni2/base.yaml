model:
  name: FastAD
  backbone: wide_resnet50_2
  layer_to_extract: 1
  device: cuda
  patchsize: 3
  stride: 1
  target_size: 224
  n_quantiles: 3
  fm_quantiles: 2
  min_q: 0
  max_q: 0.98
  fm_min_q: 0
  fm_max_q: 0.98
  patch_covariance_method: full
  global_covariance_method: LedoitWolf
  regularization: 0.01
  pretrained_weights_path: ${paths.weights.wide_resnet50_2}
dataset:
  name: MVTec-AD
  source: ${paths.datasets.visa}
  classname: macaroni2
  resize: 224
  train_batch_size: 32
  val_batch_size: 32
  test_batch_size: 32
  train_val_split: 0.3
  num_workers: 4
logging:
  output_dir: ${paths.project_root}/outputs/VisA/macaroni2/base
  log_dir: ${paths.project_root}/logs/VisA/macaroni2/base
