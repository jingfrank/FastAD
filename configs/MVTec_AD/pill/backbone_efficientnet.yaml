model:
  name: FastAD
  backbone: tf_efficientnet_b4            
  layer_to_extract: 3      
  device: cuda                  

  # Patch 相关
  patchsize: 3
  stride: 1

  target_size: 256       

  # 分位数参数
  n_quantiles: 3
  fm_quantiles: 2
  min_q: 0.005
  max_q: 0.99
  fm_min_q: 0
  fm_max_q: 1
  # 协方差估计方法
  patch_covariance_method: full   
  global_covariance_method: EmpiricalCovariance
  regularization: 0.01
  # 额外功能
  pretrained_weights_path: ${paths.weights.efficientnet_b4}

dataset:
  name: MVTec-AD
  source: ${paths.datasets.mvtec}
  classname: pill
  resize : 256
  train_batch_size: 32
  val_batch_size: 32
  test_batch_size: 32
  train_val_split: 0.9
  num_workers: 8


logging:
  output_dir: ${paths.project_root}/outputs/MVTec_AD/pill/efficientnet
  log_dir: ${paths.project_root}/logs/MVTec_AD/pill/efficientnet