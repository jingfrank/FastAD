model:
  name: FastAD
  backbone: wide_resnet50_2
  layer_to_extract: 3
  device: cuda
  patchsize: 3
  stride: 1
  target_size: 256
  n_quantiles: 10
  fm_quantiles: 2
  min_q: 0.0
  max_q: 1.0
  fm_min_q: 0.0
  fm_max_q: 1.0
  patch_covariance_method: full
  global_covariance_method: LedoitWolf
  regularization: 0.01
  pretrained_weights_path: ${paths.weights.wide_resnet50_2}
dataset:
  name: MVTec-LOCO
  source: ${paths.datasets.mvtec}_loco
  classname: breakfast_box
  resize: 256
  train_batch_size: 32
  val_batch_size: 32
  test_batch_size: 32
  train_val_split: 1.0
  num_workers: 1
logging:
  output_dir: ${paths.project_root}/outputs/MVTec_LOCO/breakfast_box/histogram
  log_dir: ${paths.project_root}/logs/MVTec_LOCO/breakfast_box/histogram
save_anomaly_maps: True
anomaly_maps_dir: ${paths.project_root}/anomaly_maps_dirhistogram
checkpoints:
  save_model: False
  save_dir: ${paths.project_root}/checkpoints/MVTec_LOCO/breakfast_box/histogram