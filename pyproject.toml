[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastad"
version = "1.0.0"
description = "FastAD: A Deployable Framework for Real-Time Visual Anomaly Detection (ICANN 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

keywords = [
    "anomaly-detection",
    "defect-detection",
    "computer-vision",
    "real-time",
    "industrial-inspection",
    "mvtec-ad",
    "mvtec-loco"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "numpy>=1.23.0",
    "opencv-python>=4.7.0",
    "pillow>=9.5.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "tifffile>=2023.0.0",
    "scikit-image>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/jingfrank/FastAD"
Repository = "https://github.com/jingfrank/FastAD.git"
Paper = "https://doi.org/10.1007/978-3-032-38401-0_22"

[tool.setuptools.packages.find]
include = ["fastad", "fastad.*"]
namespaces = false
