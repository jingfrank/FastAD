model:
  name: FastAD
  backbone: wide_resnet50_2
  layer_to_extract: 2
  device: cuda
  patchsize: 3
  stride: 1
  target_size: 256
  n_quantiles: 3
  fm_quantiles: 2
  fm_min_q: 0.01
  fm_max_q: 0.99
  min_q: 0.001
  max_q: 0.95
  patch_covariance_method: full
  global_covariance_method: LedoitWolf
  regularization: 0.0001
  pretrained_weights_path: ${paths.weights.wide_resnet50_2}
dataset:
  name: MVTec-LOCO
  source: ${paths.datasets.loco}
  classname: screw_bag
  resize: 256
  train_batch_size: 64
  val_batch_size: 64
  test_batch_size: 64
  train_val_split: 1.0
  num_workers: 1
logging:
  output_dir: ${paths.project_root}/outputs/MVTec_LOCO/screw_bag/base
  log_dir: ${paths.project_root}/logs/MVTec_LOCO/screw_bag/base
save_anomaly_maps: true
anomaly_maps_dir: ${paths.project_root}/anomaly_maps_dirMVTec_LOCO/screw_bag
checkpoints:
  save_model: false
  save_dir: ${paths.project_root}/checkpoints/MVTec_LOCO/screw_bag
